[package]
name = "symbolis"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
dirs = "5.0"
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
global-hotkey = "0.8"
notify = "6.1"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
